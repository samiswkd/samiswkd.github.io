    # Y-FoRM
    - type: id_yform
      project_name: "SCM을 활용한 코리안 디스카운트 이벤트 분석과 CVaR 포트폴리오 리밸런싱"
      project_excerpt: "Y-FoRM에서 진행했던 3번째로 프로젝트입니다. UCB 교환학생 시절 진행한 소논문에서 데이터셋 및 방법론의 변경을 통해 한층 더 발전시켰습니다."
      img: ":projectKDSCM_thumb.jpg"
      date: "2025-04-11"
      post: |
        # 배경
        이 보고서는 한국 증시에서 발생하는 ‘코리안 디스카운트’ 현상을 정량적으로 분석하고 이를 바탕으로 리스크 대응형 포트폴리오 리밸런싱 전략을 제시한 프로젝트로, 1부에서는 SCM(Synthetic Control Method)을 통해 정치·지정학·제도 등 25개의 주요 이벤트가 국내 7개 산업 섹터(반도체, 자동차, IT, 항공, 금융, 헬스케어, 통신)에 미치는 영향을 비교 분석하고 이벤트별로 GAP(CVaR 기준 주가 괴리도)를 산출하여 섹터별 민감도와 반응 패턴을 도출했으며, 2부에서는 이 분석 결과를 기반으로 각 섹터의 GAP 반응 패턴과 CVaR을 반영한 리밸런싱 모델을 수립하고 이벤트 유형별로 포트폴리오 백테스트 및 최적화를 수행한 결과, 이벤트에 따라 리밸런싱 성과가 상이하고 CVaR 기반 전략이 기존 EWP(Equal Weight Portfolio)보다 성과가 향상됨을 확인하였으며, 이를 통해 한국 증시의 구조적 리스크 요인에 대응 가능한 정량적 투자 전략 수립의 가능성을 제시했습니다.

        # 데이터 
        - 크기: 종가 기준, 약 2500row(기존 5400에서 전처리로 감소) 
          - Why NOT P/E? 기업 자체 수익성따른 요인이 크고, 수집이 용이하지 않았음.
        - 출처: 6개 증시(한, 중, 일, 미, 유, 대만), 7개 섹터(통신, 헬스케어, 항공, 자동차, 반도체, 금융, IT)에서 50개 기업의 10년치 데이터 수집
          -  Why 10년? 비교적 최근의 트렌드를 확인하고자 하였기 때문. Why 나라/섹터? 한국과 유사하지만 코리안 디스카운트 이벤트의 영향을 적게 받는다는 기준 하에 설정.
        - 이벤트: 총 23개
          - 출처: Google Trends, 인사이트 등 정성적 분석. 보수주의 의거해 최대한 많은 이벤트 선정.

        # 방법론
        - SCM(Synthesized Control Method) 기반의 이벤트 분석
          - SCM은 특정 이벤트 발생 시, 해당 이벤트가 발생하지 않았을 경우의 주가를 counterfactual로 추정하는 방법론으로, 기존의 event study와 달리, 이벤트 발생 시점 전후의 주가를 모두 고려하여 counterfactual을 추정할 수 있다는 장점이 있음. 
          - Why NOT DiD? DiD는 여러 처치집단에 적용해야하고, 처치집단-통제집단 간 평행추세가 필요. 각 종가를 단순평균한 것은 DiD에 적합하나 이외 요소가 더 중요하다 판단.

        # 전반적 flow
        - 23개 이벤트 대해 2400 데이터를 7개 섹터로, 그리고 일별이 아닌 주별로(효과가 더 유효) SCM 분석해 GAP지수(loss ftn,<0일수록 이벤트가 유효) 도출
          - 섹터별 GAP을 가중치의 성장률로 삼아 포트폴리오 구성(초기 가중치는 KRX 섹터별 시가총액 비중), 이후 섹터별 CVaR 계산 후 CVaR 기준 TOP3 섹터 CVaR 최소화
          - 이후 최근 이벤트에 대해 백테스팅한 결과 CVaR 최적화 효과가 Micro Event(제도)는 금융,IT가 유효하며 Macro Event(지정학 리스크)는 반도체, 금융 섹터가 유효.

        # 한계
        - 회사별 상장 시기 상이, 나라 간 시차 반영 X(금요일 효과 등)
        - 전처리 과정에서 적잖은 데이터 소실
        - CVaR 위해 정규분포 가정했지만 실제 주가 데이터는 꼬리 위험 존재
        - Cumulative CVaR 고안했지만 그럼에도 초기 자료는 부정확
        - 스트레스 테스트 안 해봄



