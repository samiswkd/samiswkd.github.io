    - type: id_yform
      project_name: "공적보증 사고율에 대한 거시경제변수의 영향력 분석 - 보증제공 기관의 특성 차이를 중심으로"
      project_excerpt: "Y-FoRM에서 1번째로 진행했던 프로젝트입니다. 공적보증 사고율에 대한 거시경제변수들의 영향력을 분석하기 위해 VECM 모형을 사용하고 다양한 보증제공 기관에 대해 이를 검증하였습니다."
      img: ":project_VECMPublic.jpg"
      date: "2024-10-08"
      post: |
        # 배경
        우리나라는 신용보증기금, 기술보증기금을 필두로, 성장잠재력이 있지만 현재 시점에서의 담보능력은 부족한 중소기업에 대해 국가 차원에서 공적보증을 제공하며 전도유망한 기업의 안정적 차입환경을 지원하고 있다. 나아가 한국무역보험공사, 수출입은행 역시 수출 관련 보증 및 보증보험을 제공하고 있으며, 주택도시보증공사는 건설업/임대업 영역에서 보증보험을 제공하고 있음. 이처럼 각 보증 관련 공공기관들은 다양한 영역(중소기업, 기술기업, 수출기업, 건설기업 및 임대업자 등)에 걸쳐 있다. 나아가 각 보증 관련 기관들이 다양한 영역에서 보증을 제공하고 있다는 것은 각 기관들의 사고율이 상이한 거시경제변수로부터 영향을 받을 가능성이 크다는 것을 뜻하며, 만약 각 기관들의 사고율에 영향을 미치는 거시경제변수들의 영향력 정도와 시차를 추정할 수 있다면 각 기관별 사고율 예측 모형을 구축하고 비교할 수 있을 것이다.

        # 데이터
        - 크기: 총 68개 row(2007 1분기 ~ 2023 4분기, 분기별 데이터)
        - 출처: ECOS, KOSIS, 각 보증기관 공시자료
        - 변수: 총 17개(gdp, construction, exim, house, ppi, cpi, aip(전산업생산지수), unemploy, deposit, loan, small_firm, kospi, corporate_bond, t_bond, cd, dollar, wti)
          - 최종선정된 변수는 기관별로 상이(ex. 장기균형식 기준 신보 13개, 무보 15개 등)

        # 방법론
        - VECM(Vector Error Correction Model) 기반의 사고율 분석
          - VECM은 시계열 자료에서 장기균형관계가 존재할 때, 단기적인 변동을 설명하기 위해 사용되는 모형으로, 각 변수 간의 상호작용과 장기균형 관계를 동시에 고려할 수 있다는 장점이 있음. 
          - Why NOT VAR? VAR은 장기균형관계를 고려하지 못하며, 단기적인 변동만을 설명하는 데 한계가 있음.

        # 전반적 flow(전 기관 공통)
        1. 단위근 검정(ADF Test): VECM은 비정상시계열을 대상으로 함.
          - 단위근이란? 오늘의 영향력이 미래에 어느 정도 영향을 미치는지를 결정하는 모수로 단위근이 존재하면 비정상 시계열을 의미
          - H0: 단위근 존재(비정상 시계열), H1: 단위근 존재하지 않음(정상 시계열)
          - lag=1로 설정
        2. 변수 선택: 상관계수 기준, Stepwise, Lasso, GETS 등 여러 방법론 중 R-squared가 가장 높게 나오는 방법으로 선택
          - Stepwise란? 변수를 하나씩 추가하거나 제거하면서 모델의 성능을 평가하여 최적의 변수 집합을 찾는 방법
          - Lasso란? 불필요한 변수의 계수를 0으로 만들어 변수 선택과 회귀 모델의 간소화를 동시에 수행하는 방법
          - GETS란? Stepwise의 확장으로, 노이즈를 최소화하고 과적합을 방지하는 변수선택 알고리즘
        3. 공적분 검정: VECM 모형 사용 위해 검증, 공적분 관계 없으면 VAR 모형 사용해야 함.
          - 공적분이란? 두 개 이상의 비정상 시계열이 장기적으로 일정한 관계를 유지하는 경우, 이들 시계열 간의 선형 결합이 정상 시계열이 되는 것을 의미
          - H0: 공적분 관계 존재하지 않음, H1: 공적분 관계 존재
          - 데이터 부족을 고려해 Critical Value = 0.1로 설정, 요한슨 검정법 사용
        4. VECM 추정: 장기균형식 & 단기균형식
        5. 충격반응함수(IRF) 분석, 분산분해: 사고율에 대한 여러 변수의 영향력 및 설명력을 시점별로 관찰
        6. 스트레스 테스트: 시나리오별 사고율, 손실액 추정
        - 시나리오 1: 레고랜드 PF + 코스피/환율 악화(사고율 증가 방향 - 코스피 상승, 환율 상승)
        - 시나리오 2-1: 레고랜드 PF + 표준편차+1 변동
        - 시나리오 2-2: 레고랜드 PF + 표준편차+2 변동
        - 시나리오 3: 한은 기준금리 50bp 인상

        # 결과
        - 신보 사고율: 중소기업을 보증하기에 인플레와 국내 주식시장에 많은 영향을 받는다
        - 무보 사고율: 수출입 기업에 보험을 제공하기 때문에 국고채와 상품수지에 많은 영향을 받는다.
        - 기보 사고율: 전체 자금중 99%가 중장기 자산으로 금리 인상에 취약. 포트폴리오 다변화 필요
        - 부산신보 사고율: 인플레, 생산지수(특히 서비스업 생산지수)에 많은 영향을 받는다.
        - 인천신보 사고율: 인플레, 시장금리에 많은 영향을 받는다.
        
        # 한계
        - 데이터 부족: 월간 데이터 구하려고 했으나 자료 부족(기보는 연간 데이터 사용)
        - 시나리오 설정의 주관성: 보다 다양한 worst & best 시나리오 구성 필요
        - lag=1 시차 설정 문제: 보다 간결하지만 2시차 이상 관찰이 필요할 수 있음

        

